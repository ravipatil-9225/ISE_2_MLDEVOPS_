# monitoring/grafana/provisioning/dashboards/dashboard.yml
#
# Tells Grafana to load all JSON dashboard files from the
# /etc/grafana/provisioning/dashboards directory at startup.

apiVersion: 1

providers:
  - name: 'Iris Predictor Dashboards'
    orgId: 1
    folder: 'MLOps Lab'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards
