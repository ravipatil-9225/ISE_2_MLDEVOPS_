# docker-compose.yml — Iris Prediction Service Stack
#
# Services:
#   iris-app   — Flask/Gunicorn ML API (port 5000)
#   jenkins    — CI/CD server (ports 8080, 50000)
#   prometheus — Metrics scraper (port 9090)
#   grafana    — Dashboard UI (port 3000)
#
# Usage:
#   docker compose up -d          # start everything
#   docker compose down -v        # stop and remove volumes
#   docker compose logs -f iris-app  # follow app logs

version: "3.9"

networks:
  mlops-net:
    driver: bridge

volumes:
  jenkins_home:
    name: jenkins_home
  prometheus_data:
    name: prometheus_data
  grafana_data:
    name: grafana_data

services:

  # ── 1. Iris Prediction App ───────────────────────────────────────────────────
  iris-app:
    image: iris-predictor:latest          # built by Jenkins pipeline (or manually)
    build:
      context: .
      dockerfile: Dockerfile
    container_name: iris-app
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
    networks:
      - mlops-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ── 2. Jenkins ──────────────────────────────────────────────────────────────
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    container_name: jenkins
    ports:
      - "8080:8080"      # Web UI
      - "50000:50000"    # JNLP agent port
    volumes:
      - jenkins_home:/var/jenkins_home
      # Mount Docker socket so Jenkins can run Docker commands inside the pipeline
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - JAVA_OPTS=-Djenkins.install.runSetupWizard=false
    networks:
      - mlops-net
    restart: unless-stopped

  # ── 3. Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      # Mount the prometheus.yml configuration file (read-only)
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"          # allows hot-reload via POST /-/reload
    networks:
      - mlops-net
    restart: unless-stopped
    depends_on:
      - iris-app

  # ── 4. Grafana ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.3.0
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-provision the Prometheus datasource and dashboard on first start
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    networks:
      - mlops-net
    restart: unless-stopped
    depends_on:
      - prometheus
